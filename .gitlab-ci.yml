include:
  - project: 'xfce/xfce4-dev-tools'
    file: '/ci/build_project.yml'

clang-format:
  script:
    # The job fails if clang-format's analysis of the merge request diff produces
    # non-empty output
    - 'git diff -U0 --no-color "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-.}" | clang-format-diff -p1'
    # check for some C-style constants we don't want to be used in this C++ project
    - '! git diff -U0 --no-color "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-.}" | grep -E "TRUE|FALSE|NULL"'
